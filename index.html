function drawLeg(h,a,far){const k=knee(h,a,92,87,1);c.save();if(far)c.filter='brightness(0.74) saturate(0.90)';limb('thighF',h,k,V(82,56));limb('shinF',k,a,V(7,74));piece('footF',a,0,.92);c.restore();}
function drawArm(shoulder,angle1,bend,near,sword){
 const l1=near?70:58,l2=near?57:43;
 const elbow=add(shoulder,V(Math.sin(angle1)*l1,Math.cos(angle1)*l1));
 const a2=angle1+bend,wrist=add(elbow,V(Math.sin(a2)*l2,Math.cos(a2)*l2));
 c.save();if(!near)c.filter='brightness(.76)';
 if(near){
  limb('upperN',shoulder,elbow,V(-75,35));
  limb('foreN',elbow,wrist,V(-41,36));
  const sr=sword-angle(V(-135,164));piece('sword',wrist,sr,.91);piece('handN',wrist,sr,1);
 }else{limb('upperF',shoulder,elbow,V(31,38));limb('foreF',elbow,wrist,V(24,37));piece('handF',wrist,angle(V(Math.sin(a2),Math.cos(a2)))-angle(V(24,37)),1);}
 c.restore();return {wrist,tip:add(wrist,V(Math.cos(sword)*193,Math.sin(sword)*193))};
}
function shadow(x,y,rx,ry,opacity){c.save();c.translate(x,y);c.scale(rx,ry);const gr=c.createRadialGradient(0,0,0,0,0,1);gr.addColorStop(0,`rgba(22,22,15,${opacity})`);gr.addColorStop(.5,`rgba(22,22,15,${opacity*.65})`);gr.addColorStop(1,'rgba(22,22,15,0)');c.fillStyle=gr;c.fillRect(-1,-1,2,2);c.restore()}
function character(){const x=p.x-cam,y=p.y;let floor=G;for(const f of platforms)if(p.x>=f.x&&p.x<=f.x+f.w&&f.y>=y-.1)floor=Math.min(floor,f.y);let alt=Math.max(0,floor-y);shadow(x+4,floor+2,37+alt*.14,8+alt*.025,.48/(1+alt*.014));
 attackFrameIndex=-1;
 if(p.state==='attack'||p.state==='skill'||p.state==='idle'){
  const elapsed=p.state==='attack'?ATTACK_TIME-p.attack:p.state==='skill'?(1-p.skill/.75)*ATTACK_TIME:0;
  const idx=originalAttackFrame(elapsed);
  if(drawOriginalAttack(x,y,idx)){rigState=null;return;}
 }
 let target=calcPose();if(!rigState)rigState=target;let k=1-Math.exp(-Math.max(0,frameDt)*21);for(const key of Object.keys(target)){let d=target[key]-rigState[key];if(key==='armN'||key==='sword')d=Math.atan2(Math.sin(d),Math.cos(d));rigState[key]+=d*(p.state==='attack'?1:k);}const q=rigState;
 if(p.on){for(const [fx,fy] of [[q.nearX,q.nearY],[q.farX,q.farY]])if(fy>-29)shadow(x+p.dir*(fx+15)*SCALE,y+1,15,4,.42);}
 c.save();c.translate(x,y);c.scale(p.dir*SCALE,SCALE);const hip=V(q.hipX,q.hipY),bodyPoint=(dx,dy)=>add(hip,rot(V(dx,dy),q.lean));const neck=bodyPoint(44,-129),shN=bodyPoint(-32,-112),shF=bodyPoint(68,-91);
 piece('cape',bodyPoint(-35,-118),q.lean+q.cape,.9);piece('tail',bodyPoint(-48,38),q.tail+.13,.92);
 drawArm(shF,q.armF+q.lean,q.elbowF,false,0);drawLeg(bodyPoint(20,0),V(q.farX,q.farY),true);drawLeg(bodyPoint(-13,0),V(q.nearX,q.nearY),false);piece('body',hip,q.lean,1);piece('head',neck,q.lean+q.head,1);drawArm(shN,q.armN+q.lean,q.elbowN,true,q.sword);piece('shoulderN',hip,q.lean,1);
 c.restore();
 
}

function render(){c.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);background();platforms.forEach(terrain);gems.forEach(g=>{if(!g.got)diamond(g.x,g.y)});targets.forEach(dummy);for(const w of waves){c.save();c.translate(w.x-cam,w.y);c.scale(Math.sign(w.v),1);c.globalAlpha=Math.min(1,w.life*3);c.strokeStyle='#bfb0ff';c.shadowBlur=18;c.shadowColor='#ad83ff';c.lineWidth=8;c.beginPath();c.arc(-20,0,37,-1.35,1.35);c.stroke();c.restore()}character();foreground();for(const f of particles){c.globalAlpha=Math.min(1,f.life*3);c.fillStyle=f.color;c.beginPath();c.arc(f.x-cam,f.y,2,0,Math.PI*2);c.fill()}c.globalAlpha=1;if(p.score===5){c.font='bold 24px system-ui';c.textAlign='center';c.fillStyle='#fff1a0';c.fillText('訓練完成！已收集全部寶石',W/2,100)}}function loop(now){let dt=Math.min(.033,(now-(last||now))/1000);last=now;frameDt=paused?0:dt;if(!paused)update(dt);render();requestAnimationFrame(loop)}const resizeCanvas=()=>{let d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);};resizeCanvas();window.addEventListener('resize',resizeCanvas);window.micoDebug=()=>({x:p.x,y:p.y,vx:p.vx,attack:p.attack,attackFrame:attackFrameIndex,sourceFrame:attackFrameIndex<0?null:[1,2,3,5,6,7,8,9,10][attackFrameIndex],on:p.on,dir:p.dir,state:p.state,score:p.score,energy:p.energy,phase:p.phase,pose:rigState?{...rigState}:null,targets:targets.map(o=>o.hp)});requestAnimationFrame(loop);
</script></body></html>
