<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101c26"><title>MICO｜動作訓練場</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}#game{width:min(100vw,177.7778dvh);height:min(56.25vw,100dvh);position:relative;overflow:hidden;background:#284e6a;container-type:inline-size}canvas{width:100%;height:100%;display:block}button{font:inherit;color:white;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;border:1.5px solid #d4e0e7a0;background:radial-gradient(ellipse at 50% 20%,#607888a8,#101d2ddc);box-shadow:inset 0 0 0 2px #ffffff15,0 3px 9px #0006;outline:none}button:active,button.on{background:#527e9cce;box-shadow:0 0 12px #9edfff9c,inset 0 0 0 2px #b1e4ff}#hud{position:absolute;left:2%;top:3%;width:29%;pointer-events:none;text-shadow:0 1px 4px #000}#name{font-family:Georgia,serif;font-weight:bold;font-size:2.5cqw;letter-spacing:.09em;color:#ffe2a9}#version{font:1cqw system-ui;color:#dbe5f0;letter-spacing:0}.meter{height:1.25cqw;background:#18202ac9;border:1px solid #e8d2a1;border-radius:3px;margin-top:.6cqw;overflow:hidden;position:relative}.meter i{display:block;height:100%;width:100%;background:linear-gradient(#ff6f62,#a61520)}.meter.energy i{background:linear-gradient(#69d9ff,#187bc6)}.meter span{position:absolute;inset:0;text-align:center;font:bold .9cqw system-ui;line-height:1.05cqw}#status{font-size:1.2cqw;margin-top:.8cqw;display:flex;gap:1cqw}#toolbar{position:absolute;right:2%;top:3%;display:flex;gap:.6cqw}#toolbar button{border-radius:.7cqw;font-size:1.6cqw;padding:.6cqw 1cqw}#direction{position:absolute;left:2.6%;bottom:4%;width:17%;aspect-ratio:1;border-radius:50%;background:#14202e72;border:1.5px solid #ffffff60;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4%;padding:8px;padding:1cqw;box-shadow:inset 0 0 0 5px #ffffff09}#direction button{border-radius:28%;font-size:3cqw;line-height:1;padding:0}#direction .center{grid-area:2/2;background:#ffffff19;border-radius:50%;border:1px solid #ffffff38;align-self:stretch}#up{grid-area:1/2}#left{grid-area:2/1}#right{grid-area:2/3}#down{grid-area:3/2}#actions{position:absolute;right:2%;bottom:3.5%;width:23%;height:43%;pointer-events:none}#actions button{pointer-events:auto;position:absolute;border-radius:50%;width:31%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.1cqw;padding:0}#actions b{font-size:3.2cqw;line-height:1}#actions small{font-size:1.15cqw;font-weight:700}#attack{right:0;bottom:0;width:43%!important;background:radial-gradient(ellipse at 50% 20%,#927657c9,#251d23dd)}#attack b{font-size:4.3cqw}#jump{left:0;bottom:0}#dash{left:13%;top:3%}#skill{right:4%;top:0;background:radial-gradient(ellipse at 50% 20%,#9c7ae0ce,#251c52dc)}#hint{position:absolute;bottom:2.2%;left:25%;right:25%;text-align:center;color:#f4f5ffb9;font-size:1.03cqw;text-shadow:0 1px 3px #000;pointer-events:none}#overlay{position:absolute;inset:0;background:#0a1525ad;display:none;align-items:center;justify-content:center;z-index:5}#overlay.show{display:flex}.panel{text-align:center;padding:2cqw 4cqw;border:1px solid #9eb7c5;border-radius:1cqw;background:#16283bea}.panel h2{font-size:3cqw;margin:0 0 1cqw}.panel p{font-size:1.5cqw}.panel button{padding:.7cqw 2cqw;border-radius:.5cqw;font-size:1.7cqw}#portrait{display:none}@media(orientation:portrait){#portrait{display:block;position:fixed;top:10%;left:0;right:0;text-align:center;font-size:14px;color:#aebbc7;pointer-events:none}}@media(max-width:600px){#direction{padding:.7cqw}#hint{font-size:1.2cqw}}
</style></head><body><div id="portrait">建議將手機轉為橫向，獲得完整操作空間</div><main id="game"><canvas id="scene" width="1280" height="720" aria-label="MICO 動作遊戲"></canvas><div id="hud"><div id="name">MICO <span id="version">動作測試 v0.1</span></div><div class="meter"><i></i><span>HP 100 / 100</span></div><div class="meter energy"><i id="energybar"></i><span id="energytext">SP 100 / 100</span></div><div id="status"><span id="state">待機</span><span id="score">寶石 0 / 5</span></div></div><div id="toolbar"><button id="reset" aria-label="重置">↻</button><button id="full" aria-label="全螢幕">⛶</button><button id="pause" aria-label="暫停">Ⅱ</button></div><div id="direction"><button id="up" data-hold="up" aria-label="向上跳躍">▲</button><button id="left" data-hold="left" aria-label="向左">◀</button><div class="center"></div><button id="right" data-hold="right" aria-label="向右">▶</button><button id="down" data-hold="down" aria-label="蹲下">▼</button></div><div id="actions"><button id="dash" data-hold="dash" aria-label="奔跑"><b>»</b><small>奔跑</small></button><button id="skill" data-act="skill" aria-label="技能"><b>✧</b><small>技能</small></button><button id="jump" data-act="jump" aria-label="跳躍"><b>↑</b><small>跳躍</small></button><button id="attack" data-act="attack" aria-label="揮劍"><b>⚔</b><small>揮劍</small></button></div><div id="hint">方向鍵 / A D 移動 · Space 跳躍 · J 揮劍 · Shift 奔跑 · K 技能</div><div id="overlay"><div class="panel"><h2>遊戲暫停</h2><p>動作訓練場</p><button id="resume">繼續遊戲</button></div></div></main><script>
/* ASSETS */
const asset=(n)=>'assets/'+n;
/* END ASSETS */
const canvas=document.getElementById('scene'),c=canvas.getContext('2d'),W=1280,H=720,G=520,L=3100;const $=id=>document.getElementById(id);const images={};function load(n){let i=new Image();i.src=asset(n);images[n]=i;return i}const bg=load('landscape.jpg'),stone=load('stone.jpg');const frames={idle:['idle_r0'],walk:[0,1,2,3,4,5,6].map(x=>'walk_l'+x),run:[0,2,3,4].map(x=>'run_l'+x),attack:[0,1,2,3,4,5,6,7,8].map(x=>'attack_l'+x),jump:[0,1,2,3].map(x=>'jump_r'+x)};Object.values(frames).flat().forEach(n=>load(n+'.png'));
let inputs=new Map(),pressed=new Set(),paused=false,last=0,t=0,cam=0,particles=[],waves=[],gems=[],targets=[],p;const platforms=[{x:0,y:G,w:L},{x:690,y:393,w:190},{x:1040,y:332,w:170},{x:1440,y:420,w:210},{x:1840,y:355,w:175},{x:2210,y:285,w:195},{x:2650,y:399,w:200}];
function reset(){p={x:390,y:G,vy:0,vx:0,dir:1,on:true,energy:100,attack:0,skill:0,anim:0,state:'idle',score:0,combo:0};cam=0;particles=[];waves=[];gems=[{x:775,y:355},{x:1120,y:294},{x:1530,y:382},{x:1930,y:317},{x:2310,y:247}].map(g=>({...g,got:false}));targets=[580,1320,2070,2810].map(x=>({x,hp:3,flash:0}));inputs.clear();pressed.clear();document.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));}
reset();function held(k){return [...inputs.values()].includes(k)||pressed.has(k)}function fx(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*230,vy:-Math.random()*170,life:.3+Math.random()*.35,color});}
function act(a){if(paused)return;if(a==='jump'&&p.on){p.vy=-750;p.on=false;fx(p.x,p.y,8,'#e6d5b5')}if(a==='attack'&&p.attack<=0){p.attack=.48;p.combo++;p.hit=false;}if(a==='skill'&&p.energy>=30&&p.skill<=0){p.energy-=30;p.skill=.75;waves.push({x:p.x+p.dir*55,y:p.y-54,v:p.dir*650,life:.95,hit:new Set()});fx(p.x,p.y-55,14,'#b99aff')}}
function holdButton(b){const k=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();if(paused)return;b.setPointerCapture(e.pointerId);inputs.set(e.pointerId,k);b.classList.add('on');if(k==='up')act('jump')});function release(e){inputs.delete(e.pointerId);if(![...inputs.values()].includes(k))b.classList.remove('on')}for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,release)}document.querySelectorAll('[data-hold]').forEach(holdButton);document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');act(b.dataset.act)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>b.classList.remove('on'))});const keymap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',Shift:'dash'};window.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(keymap[k]||[' ','j','k','Escape'].includes(k))e.preventDefault();if(keymap[k]){pressed.add(keymap[k]);if(!e.repeat&&keymap[k]==='up')act('jump')}if(!e.repeat){if(k===' ')act('jump');if(k==='j')act('attack');if(k==='k')act('skill');if(k==='Escape')pause()}});window.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key; // preserve held alternate keys in normal usage
if(keymap[k])pressed.delete(keymap[k])});window.addEventListener('blur',()=>{inputs.clear();pressed.clear();document.querySelectorAll('.on').forEach(b=>b.classList.remove('on'))});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)pause()});function pause(){paused=!paused;inputs.clear();pressed.clear();document.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));$('overlay').classList.toggle('show',paused)}$('pause').onclick=pause;$('resume').onclick=pause;$('reset').onclick=()=>{reset();if(paused)pause()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else if($('game').requestFullscreen)$('game').requestFullscreen().catch(()=>{});else $('hint').textContent='此瀏覽器不支援網頁全螢幕，請使用橫向顯示。'};
function hit(o){if(o.hp>0){o.hp--;o.flash=.22;fx(o.x,G-55,10,'#ffc77f')}}
function update(dt){t+=dt;let d=Number(held('right'))-Number(held('left'));let run=held('dash')&&p.energy>1&&d!==0;let crouch=held('down')&&p.on;let v=d*(run?400:230)*(crouch?.42:1)*(p.attack>0?.45:1);p.vx+=(v-p.vx)*Math.min(1,dt*15);if(d)p.dir=d;p.x=Math.max(45,Math.min(L-45,p.x+p.vx*dt));let old=p.y;p.vy+=1800*dt;p.y+=p.vy*dt;p.on=false;if(p.vy>=0){for(const f of platforms){if(p.x>f.x+6&&p.x<f.x+f.w-6&&old<=f.y+.1&&p.y>=f.y){p.y=f.y;p.vy=0;p.on=true;break}}}if(p.y>H+180){p.x=390;p.y=G;p.vy=0;p.on=true}p.energy=Math.max(0,Math.min(100,p.energy+dt*(run?-15:12)));if(run&&Math.random()<dt*12)fx(p.x,p.y,1,'#e3d2ac');if(p.attack>0){p.attack=Math.max(0,p.attack-dt);if(p.attack<.28&&!p.hit){p.hit=true;targets.forEach(o=>{if(Math.abs(p.y-G)<72&&(o.x-p.x)*p.dir>0&&Math.abs(o.x-p.x)<130)hit(o)})}}p.skill=Math.max(0,p.skill-dt);let next=p.attack>0?'attack':p.skill>0?'skill':!p.on?'jump':crouch?'crouch':Math.abs(p.vx)>20?(run?'run':'walk'):'idle';if(next!==p.state){p.state=next;p.anim=0}else p.anim+=dt;for(const gem of gems){if(!gem.got&&Math.hypot(p.x-gem.x,p.y-55-gem.y)<54){gem.got=true;p.score++;fx(gem.x,gem.y,20,'#ffdb64')}}for(const o of targets)o.flash=Math.max(0,o.flash-dt);for(const w of waves){w.x+=w.v*dt;w.life-=dt;targets.forEach(o=>{if(!w.hit.has(o)&&Math.abs(w.x-o.x)<45&&Math.abs(w.y-(G-54))<65){w.hit.add(o);hit(o)}})}waves=waves.filter(w=>w.life>0);for(const f of particles){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=420*dt;f.life-=dt}particles=particles.filter(f=>f.life>0);cam+=(Math.max(0,Math.min(L-W,p.x-W*.43))-cam)*Math.min(1,dt*5);$('energybar').style.width=p.energy+'%';$('energytext').textContent='SP '+Math.round(p.energy)+' / 100';$('state').textContent=({idle:'待機',walk:'走路',run:'奔跑',attack:'揮劍',jump:'跳躍',skill:'技能',crouch:'蹲下'})[p.state];$('score').textContent='寶石 '+p.score+' / 5'}
function ready(i){return i?.complete&&i.naturalWidth>0}function background(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4d9be2');g.addColorStop(1,'#b5d9dd');c.fillStyle=g;c.fillRect(0,0,W,H);if(ready(bg)){let dw=W+180,dh=G+35;c.drawImage(bg,-(cam/(L-W))*180,0,dw,dh)}c.fillStyle='#1a395218';c.fillRect(0,0,W,H)}
function terrain(f){let x=f.x-cam,y=f.y;if(x>W||x+f.w<0)return;let h=f.y===G?H-y+30:62;c.fillStyle='#3b4245';c.fillRect(x,y,f.w,h);c.save();c.beginPath();c.rect(x,y,f.w,h);c.clip();if(ready(stone)){for(let j=0;j<h;j+=96)for(let i=Math.max(0,Math.floor((-x)/180)*180);i<f.w&&i+x<W;i+=180)c.drawImage(stone,x+i,y+j,180,96)}c.restore();c.fillStyle='#263a21';c.fillRect(x,y-5,f.w,9);c.fillStyle='#799447';c.fillRect(x,y-7,f.w,4);c.fillStyle='#bbcc71';c.fillRect(x,y-8,f.w,1.5);for(let i=0;i<f.w;i+=17){let a=x+i;if(a>=-10&&a<=W+10){c.strokeStyle=i%3?'#88a44a':'#d6d68b';c.lineWidth=1.4;c.beginPath();c.moveTo(a,y-6);c.lineTo(a+Math.sin(i)*5,y-12-i%5);c.stroke()}}}
function diamond(x,y){c.save();c.translate(x-cam,y+Math.sin(t*3+x)*5);c.shadowColor='#ffdc68';c.shadowBlur=15;c.fillStyle='#ffcf46';c.beginPath();c.moveTo(0,-15);c.lineTo(10,0);c.lineTo(0,15);c.lineTo(-10,0);c.closePath();c.fill();c.shadowBlur=0;c.strokeStyle='#fff3b7';c.lineWidth=1.5;c.stroke();c.beginPath();c.moveTo(0,-15);c.lineTo(0,15);c.moveTo(-10,0);c.lineTo(10,0);c.stroke();c.restore()}
function dummy(o){if(!o.hp)return;let x=o.x-cam;c.save();c.translate(x,G);c.fillStyle='#5a3927';c.fillRect(-6,-76,12,76);c.fillStyle=o.flash?'#fff3ac':'#a66b3c';c.strokeStyle='#5e3e2b';c.lineWidth=4;c.beginPath();c.roundRect(-23,-92,46,47,9);c.fill();c.stroke();c.fillStyle='#e3bd77';c.beginPath();c.arc(0,-69,14,0,Math.PI*2);c.fill();c.fillStyle='#95433a';c.beginPath();c.arc(0,-69,7,0,Math.PI*2);c.fill();for(let i=0;i<3;i++){c.fillStyle=i<o.hp?'#e5b453':'#482c25';c.fillRect(-19+i*13,-108,11,4)}c.restore()}
function character(){let x=p.x-cam,y=p.y;let st=p.state;let group=st==='skill'?'attack':st==='crouch'?'idle':st;let a=frames[group],idx=0;if(group==='walk')idx=Math.floor(p.anim*11)%a.length;if(group==='run')idx=Math.floor(p.anim*15)%a.length;if(group==='attack')idx=Math.min(a.length-1,Math.floor((st==='skill'?1-p.skill/.75:1-p.attack/.48)*a.length));if(group==='jump')idx=p.vy<-200?0:p.vy<50?1:p.vy<350?2:3;let im=images[a[idx]+'.png'];let baseDir=['walk','run','attack'].includes(group)?-1:1;let flip=p.dir!==baseDir;let height=group==='idle'?106:group==='run'?96:group==='attack'?99:group==='jump'?98:103;let bob=group==='idle'?Math.sin(t*3)*1.2:0;let floor=G;for(const f of platforms)if(p.x>f.x&&p.x<f.x+f.w&&f.y>=p.y-1)floor=Math.min(floor,f.y);c.fillStyle='#13261c55';c.beginPath();c.ellipse(x,floor+1,22,5,0,0,Math.PI*2);c.fill();c.save();c.translate(x,y+bob);c.scale(flip?-1:1,st==='crouch'?.72:1);if(ready(im)){let w=height*im.width/im.height;c.imageSmoothingEnabled=true;c.drawImage(im,-w*.5,-height,w,height)}else{c.fillStyle='#9f7047';c.fillRect(-15,-90,30,90)}c.restore();if(p.attack>0){let prog=1-p.attack/.48,ang=-2.1+prog*3.5;c.save();c.translate(x,y-51);c.scale(p.dir,1);c.rotate(ang);c.strokeStyle='#53432e';c.lineWidth=7;c.beginPath();c.moveTo(9,0);c.lineTo(20,0);c.stroke();c.strokeStyle='#d5e8ed';c.lineWidth=6;c.beginPath();c.moveTo(20,0);c.lineTo(86,0);c.stroke();c.strokeStyle='#f3c575';c.lineWidth=3;c.beginPath();c.moveTo(20,-7);c.lineTo(20,7);c.stroke();c.restore();if(prog>.18&&prog<.8){c.save();c.translate(x,y-51);c.scale(p.dir,1);c.globalAlpha=Math.sin(prog*Math.PI)*.9;c.strokeStyle='#d6f4ff';c.shadowBlur=12;c.shadowColor='#83d7ff';c.lineWidth=8;c.beginPath();c.arc(0,0,81,-1.7,ang);c.stroke();c.restore()}}}
function render(){background();platforms.forEach(terrain);gems.forEach(g=>{if(!g.got)diamond(g.x,g.y)});targets.forEach(dummy);for(const w of waves){c.save();c.translate(w.x-cam,w.y);c.scale(Math.sign(w.v),1);c.globalAlpha=Math.min(1,w.life*3);c.strokeStyle='#bfb0ff';c.shadowBlur=18;c.shadowColor='#ad83ff';c.lineWidth=8;c.beginPath();c.arc(-20,0,37,-1.35,1.35);c.stroke();c.restore()}character();for(const f of particles){c.globalAlpha=Math.min(1,f.life*3);c.fillStyle=f.color;c.fillRect(f.x-cam,f.y,3,3)}c.globalAlpha=1;if(p.score===5){c.font='bold 24px system-ui';c.textAlign='center';c.fillStyle='#fff1a0';c.fillText('訓練完成！已收集全部寶石',W/2,100)}}function loop(now){let dt=Math.min(.033,(now-(last||now))/1000);last=now;if(!paused)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
